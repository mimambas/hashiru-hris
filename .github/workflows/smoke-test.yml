name: Smoke test backend (manual)

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Login
        id: login
        run: |
          RESP=$(curl -s -m 60 -X POST https://hris-backend-eta.vercel.app/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@hashiru.id","password":"Password123!"}')
          echo "$RESP" | head -c 200; echo
          TOKEN=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          echo "token_len=${#TOKEN}"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
      - name: Employees (auth)
        run: |
          curl -s -m 60 "https://hris-backend-eta.vercel.app/api/v1/employees?per_page=3" \
            -H "Authorization: Bearer ${{ steps.login.outputs.token }}" | head -c 400; echo
      - name: Dashboard summary (auth)
        run: |
          curl -s -m 60 "https://hris-backend-eta.vercel.app/api/v1/dashboard/summary" \
            -H "Authorization: Bearer ${{ steps.login.outputs.token }}" | head -c 400; echo
      - name: CORS preflight
        run: |
          curl -s -m 30 -X OPTIONS https://hris-backend-eta.vercel.app/api/v1/auth/login \
            -H "Origin: https://hris-hashiru.vercel.app" \
            -H "Access-Control-Request-Method: POST" -i | head -12
      - name: Health
        run: curl -s -m 30 https://hris-backend-eta.vercel.app/health; echo
